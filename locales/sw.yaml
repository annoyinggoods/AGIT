  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Usanidi wa Mwongozo wa Ollama                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Orodhesha modeli zilizosakinishwa:     ollama list             \u2551\n\u2551  Endesha seva:            ollama serve                          \u2551\n\u2551  Vuta modeli:              ollama pull <name>                   \u2551\n\u2551  Futa modeli:            ollama rm <name>                       \u2551\n\u2551                                                                \u2551\n\u2551  Rekebisha GPU / VRAM (weka kabla ya ollama serve):             \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (VRAM ya juu kutumika)      \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (hifadhi kwa onyesho)       \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (wezesha flash attention)   \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (maombi ya wakati mmoja)    \u2551\n\u2551                                                                \u2551\n\u2551  Nyaraka: https://ollama.com/docs                               \u2551\n\u2551                                                                \u2551\n\u2551  MUHIMU: Ikiwa programu ya Ollama ya eneo-kazi inafanya kazi,   \u2551\n\u2551  port 11434 tayari inatumika. Izime kabla ya kuendesha \"ollama  \u2551\n\u2551  serve\" na bendera zako.                                        \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Usanidi wa Mwongozo wa Ollama                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Orodhesha modeli zilizosakinishwa:     ollama list             \u2551\n\u2551  Endesha seva:            ollama serve                          \u2551\n\u2551  Vuta modeli:              ollama pull <name>                   \u2551\n\u2551  Futa modeli:            ollama rm <name>                       \u2551\n\u2551                                                                \u2551\n\u2551  Rekebisha GPU / VRAM (weka kabla ya ollama serve):             \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # VRAM ya juu kutumika   \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # hifadhi kwa onyesho    \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # wezesha flash attention\u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # maombi ya wakati mmoja \u2551\n\u2551                                                                \u2551\n\u2551  Nyaraka: https://ollama.com/docs                               \u2551\n\u2551                                                                \u2551\n\u2551  MUHIMU: Ikiwa programu ya Ollama ya eneo-kazi inafanya kazi,   \u2551\n\u2551  port 11434 tayari inatumika. Izime kabla ya kuendesha \"ollama  \u2551\n\u2551  serve\" na bendera zako.                                        \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

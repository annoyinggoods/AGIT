lash Attention)         \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (\u5E76\u53D1\u8BF7\u6C42\u6570)                      \u2551\n\u2551                                                                  \u2551\n\u2551  \u6587\u6863: https://ollama.com/docs                                     \u2551\n\u2551                                                                  \u2551\n\u2551  \u91CD\u8981\u63D0\u793A: \u5982\u679C Ollama \u684C\u9762\u5E94\u7528\u6B63\u5728\u8FD0\u884C\uFF0C\u5B83\u5DF2\u5360\u7528 11434 \u7AEF\u53E3\u3002                         \u2551\n\u2551  \u5728\u4F7F\u7528\u81EA\u5B9A\u4E49\u6807\u5FD7\u8FD0\u884C \"ollama serve\" \u4E4B\u524D\uFF0C\u8BF7\u5148\u505C\u6B62\u5B83\u3002                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Configura\xE7\xE3o manual do Ollama                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Listar modelos instalados:     ollama list                     \u2551\n\u2551  Iniciar o servidor:            ollama serve                    \u2551\n\u2551  Baixar um modelo:              ollama pull <name>              \u2551\n\u2551  Excluir um modelo:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  Ajuste de GPU / VRAM (defina antes de ollama serve):           \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (VRAM m\xE1ximo a usar)        \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (reserva para o v\xEDdeo)      \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (ativa o flash attention)   \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (requisi\xE7\xF5es simult\xE2neas)   \u2551\n\u2551                                                                \u2551\n\u2551  Documenta\xE7\xE3o: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANTE: se o aplicativo Ollama Desktop estiver em          \u2551\n\u2551  execu\xE7\xE3o, a porta 11434 j\xE1 estar\xE1 ocupada. Encerre-o antes de  \u2551\n\u2551  executar \"ollama serve\" com flags personalizadas.              \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Configura\xE7\xE3o manual do Ollama                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Listar modelos instalados:     ollama list                     \u2551\n\u2551  Iniciar o servidor:            ollama serve                    \u2551\n\u2551  Baixar um modelo:              ollama pull <name>              \u2551\n\u2551  Excluir um modelo:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  Ajuste de GPU / VRAM (defina antes de ollama serve):           \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # VRAM m\xE1ximo a usar     \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # reserva para o v\xEDdeo   \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # ativa o flash attention\u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # requisi\xE7\xF5es simult\xE2neas\u2551\n\u2551                                                                \u2551\n\u2551  Documenta\xE7\xE3o: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANTE: se o aplicativo Ollama Desktop estiver em          \u2551\n\u2551  execu\xE7\xE3o, a porta 11434 j\xE1 estar\xE1 ocupada. Encerre-o antes de  \u2551\n\u2551  executar \"ollama serve\" com flags personalizadas.              \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

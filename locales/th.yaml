  import.ocr_required_text: "\u0E40\u0E2D\u0E01\u0E2A\u0E32\u0E23\u0E19\u0E35\u0E49\u0E15\u0E49\u0E2D\u0E07\u0E43\u0E0A\u0E49 OCR \u0E41\u0E15\u0E48\u0E44\u0E21\u0E48\u0E21\u0E35\u0E40\u0E2D\u0E47\u0E19\u0E08\u0E34\u0E19 OCR \u0E17\u0E35\u0E48\u0E1E\u0E23\u0E49\u0E2D\u0E21\u0E43\u0E0A\u0E49\u0E07\u0E32\u0E19\n\n\u0E17\u0E32\u0E07\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E17\u0E35\u0E48 1 (\u0E02\u0E19\u0E32\u0E14\u0E43\u0E2B\u0E0D\u0E48): \u0E15\u0E34\u0E14\u0E15\u0E31\u0E49\u0E07 docling (~\u0E1E\u0E32\u0E23\u0E32\u0E21\u0E34\u0E40\u0E15\u0E2D\u0E23\u0E4C 650M):\npip install docling\n\n\u0E17\u0E32\u0E07\u0E40\u0E25\u0E37\u0E2D\u0E01\u0E17\u0E35\u0E48 2 (\u0E02\u0E19\u0E32\u0E14\u0E40\u0E25\u0E47\u0E01, CPU \u0E40\u0E17\u0E48\u0E32\u0E19\u0E31\u0E49\u0E19): \u0E27\u0E32\u0E07\u0E44\u0E1F\u0E25\u0E4C GGUF LightOnOCR-2-1B (~\u0E23\u0E27\u0E21 639 MB) \u0E25\u0E07\u0E43\u0E19 data/models/lightonocr/\n\n\u0E15\u0E49\u0E2D\u0E07\u0E01\u0E32\u0E23\u0E15\u0E34\u0E14\u0E15\u0E31\u0E49\u0E07 docling \u0E15\u0E2D\u0E19\u0E19\u0E35\u0E49\u0E2B\u0E23\u0E37\u0E2D\u0E44\u0E21\u0E48?"
  import.frozen_extra_title: "ไม่พร้อมใช้งานในรุ่นที่ติดตั้งแล้ว"
  import.frozen_extra_text: "รุ่นที่ติดตั้งแล้วมีสภาพแวดล้อม Python อยู่ในไฟล์ปฏิบัติการ และไม่สามารถเพิ่มแพ็กเกจ Python ภายหลังได้\n\nในการติดตั้งแบบพัฒนา ขั้นตอนที่เทียบเท่าคือ:\n    {manual_command}"
  import.ocr_required_frozen_text: "เอกสารนี้ต้องการ OCR แต่ไม่มีเอนจิน OCR ที่ใช้ได้\n\nรุ่นที่ติดตั้งแล้วไม่สามารถเพิ่มส่วนขยาย docling ได้ ให้ใช้เอนจิน OCR แบบ CPU ในตัวแทน: วางไฟล์ LightOnOCR-2-1B GGUF (รวมประมาณ 639 MB) ลงใน\n    {model_dir}\n  ({model_files})\nจากนั้นรีสตาร์ท AGIT และนำเข้าไฟล์อีกครั้ง"

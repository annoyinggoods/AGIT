  privacy.backup.gate.verify_question: "คุณตรวจสอบแล้วหรือยังว่าไฟล์ที่ถูกต้องถูกคัดลอกไปยังสื่อที่ปลอดภัย?"
  privacy.backup.gate.verify_yes: "\u0E43\u0E0A\u0E48"

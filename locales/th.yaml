  privacy.backup.gate.title: "สำรองคีย์ของคุณ"
  privacy.backup.gate.instruction: "คีย์การเข้ารหัสของคุณมีอยู่เฉพาะในโฟลเดอร์คีย์ของ AGIT บนคอมพิวเตอร์เครื่องนี้ — ไม่มีการสำรองไว้ที่อื่น ก่อนดำเนินการต่อ โปรดคัดลอกโฟลเดอร์ด้านล่างไปยังสื่อออฟไลน์ที่ปลอดภัย (แฟลชไดรฟ์หรือสื่อถอดได้อื่น ๆ — อย่าใช้คลาวด์เดียวกับที่คุณซิงก์เอกสารไป)"
  privacy.backup.gate.instruction_how: "คัดลอกทั้งโฟลเดอร์ — ทุกไฟล์ในนั้น — ขณะที่การเข้ารหัสยังตั้งค่าและทำงานอยู่ แล้วตรวจสอบว่าสำเนาเปิดได้จากตำแหน่งออฟไลน์นั้นก่อนที่จะพึ่งพิงมัน"
  privacy.backup.gate.instruction_ok: "ตกลง — ฉันจะสำรองคีย์"

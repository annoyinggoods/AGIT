  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama Manual Configuration                       \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  List installed models:     ollama list                         \u2551\n\u2551  Run the server:            ollama serve                        \u2551\n\u2551  Pull a model:              ollama pull <name>                  \u2551\n\u2551  Delete a model:            ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM tuning (set before ollama serve):                   \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (max VRAM to use)           \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (reserve for display)       \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (enable flash attention)    \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (concurrent requests)       \u2551\n\u2551                                                                \u2551\n\u2551  Docs: https://ollama.com/docs                                  \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANT: If Ollama desktop app is running, it already        \u2551\n\u2551  occupies port 11434. Stop it before running \\\"ollama serve\\\"     \u2551\n\u2551  with custom flags.                                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama Manual Configuration                       \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  List installed models:     ollama list                         \u2551\n\u2551  Run the server:            ollama serve                        \u2551\n\u2551  Pull a model:              ollama pull <name>                  \u2551\n\u2551  Delete a model:            ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM tuning (set before ollama serve):                   \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\\\"8GB\\\"        # max VRAM to use        \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\\\"512MB\\\"  # reserve for display    \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\\\"1\\\"   # enable flash attention \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\\\"1\\\"      # concurrent requests    \u2551\n\u2551                                                                \u2551\n\u2551  Docs: https://ollama.com/docs                                  \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANT: If Ollama desktop app is running, it already        \u2551\n\u2551  occupies port 11434. Stop it before running \\\"ollama serve\\\"     \u2551\n\u2551  with custom flags.                                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

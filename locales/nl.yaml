  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama handmatig configureren                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Ge\xEFnstalleerde modellen tonen:     ollama list                 \u2551\n\u2551  Server starten:            ollama serve                        \u2551\n\u2551  Model ophalen:              ollama pull <name>                 \u2551\n\u2551  Model verwijderen:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM-tuning (instellen v\xF3\xF3r ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (maximaal te gebruiken VRAM)\u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (reserve voor weergave)     \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (flash attention aan)       \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (gelijktijdige verzoeken)   \u2551\n\u2551                                                                \u2551\n\u2551  Documentatie: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  BELANGRIJK: Draait de Ollama-desktopapp al, dan is poort       \u2551\n\u2551  11434 al in gebruik. Stop die voordat je \"ollama serve\" met    \u2551\n\u2551  eigen opties start.                                            \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama handmatig configureren                     \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Ge\xEFnstalleerde modellen tonen:     ollama list                 \u2551\n\u2551  Server starten:            ollama serve                        \u2551\n\u2551  Model ophalen:              ollama pull <name>                 \u2551\n\u2551  Model verwijderen:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM-tuning (instellen v\xF3\xF3r ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"     # maximaal te gebruiken VRAM\u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # reserve voor weergave  \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # flash attention aan    \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # gelijktijdige verzoeken\u2551\n\u2551                                                                \u2551\n\u2551  Documentatie: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  BELANGRIJK: Draait de Ollama-desktopapp al, dan is poort       \u2551\n\u2551  11434 al in gebruik. Stop die voordat je \"ollama serve\" met    \u2551\n\u2551  eigen opties start.                                            \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

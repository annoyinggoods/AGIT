  settings.ai.ollama_terminal_help: "\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551 C\u1EA5u h\xECnh th\u1EE7 c\xF4ng Ollama \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551 \u2551\n\u2551 Li\u1EC7t k\xEA m\xF4 h\xECnh \u0111\xE3 c\xE0i: ollama list \u2551\n\u2551 Ch\u1EA1y m\xE1y ch\u1EE7: ollama serve \u2551\n\u2551 T\u1EA3i m\u1ED9t m\xF4 h\xECnh: ollama pull <name> \u2551\n\u2551 X\xF3a m\u1ED9t m\xF4 h\xECnh: ollama rm <name> \u2551\n\u2551 \u2551\n\u2551 Tinh ch\u1EC9nh GPU / VRAM (\u0111\u1EB7t tr\u01B0\u1EDBc ollama serve): \u2551\n\u2551 \u2551\n\u2551 set OLLAMA_MAX_VRAM=8GB (VRAM t\u1ED1i \u0111a s\u1EED d\u1EE5ng) \u2551\n\u2551 set OLLAMA_GPU_OVERHEAD=512MB (d\u1EF1 tr\u1EEF cho m\xE0n h\xECnh) \u2551\n\u2551 set OLLAMA_FLASH_ATTENTION=1 (b\u1EADt flash attention) \u2551\n\u2551 set OLLAMA_NUM_PARALLEL=1 (y\xEAu c\u1EA7u \u0111\u1ED3ng th\u1EDDi) \u2551\n\u2551 \u2551\n\u2551 T\xE0i li\u1EC7u: https://ollama.com/docs \u2551\n\u2551 \u2551\n\u2551 QUAN TR\u1ECCNG: N\u1EBFu \u1EE9ng d\u1EE5ng Ollama desktop \u0111ang ch\u1EA1y, n\xF3 \u0111\xE3 \u2551\n\u2551 chi\u1EBFm c\u1ED5ng 11434. H\xE3y d\u1EEBng n\xF3 tr\u01B0\u1EDBc khi ch\u1EA1y \"ollama serve\" \u2551\n\u2551 v\u1EDBi c\xE1c c\u1EDD t\xF9y ch\u1EC9nh. \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

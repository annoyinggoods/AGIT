  import.ocr_progress: "OCR {percent}% \u2014 {message}"
  import.ocr_required_text: "T\xE0i li\u1EC7u n\xE0y c\u1EA7n OCR, nh\u01B0ng kh\xF4ng c\xF3 \u0111\u1ED9ng c\u01A1 OCR n\xE0o kh\u1EA3 d\u1EE5ng.\nT\xF9y ch\u1ECDn 1 (n\u1EB7ng): c\xE0i \u0111\u1EB7t docling (~650 tri\u1EC7u tham s\u1ED1):\npip install docling\nT\xF9y ch\u1ECDn 2 (nh\u1EB9, ch\u1EC9 CPU): th\u1EA3 c\xE1c t\u1EC7p GGUF LightOnOCR-2-1B (~639 MB t\u1ED5ng) v\xE0o data/models/lightonocr/.\nC\xE0i \u0111\u1EB7t docling ngay b\xE2y gi\u1EDD?"

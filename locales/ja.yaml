  import.ocr_progress: "OCR {percent}% \u2014 {message}"
  import.ocr_required_text: "\u3053\u306E\u30C9\u30AD\u30E5\u30E1\u30F3\u30C8\u306B\u306F OCR \u304C\u5FC5\u8981\u3067\u3059\u304C\u3001\u5229\u7528\u53EF\u80FD\u306A OCR \u30A8\u30F3\u30B8\u30F3\u304C\u3042\u308A\u307E\u305B\u3093\u3002\n\n\u30AA\u30D7\u30B7\u30E7\u30F3 1 (\u91CD\u91CF\u7D1A): docling \u3092\u30A4\u30F3\u30B9\u30C8\u30FC\u30EB (~650M \u30D1\u30E9\u30E1\u30FC\u30BF\u30FC):\n    pip install docling\n\n\u30AA\u30D7\u30B7\u30E7\u30F3 2 (\u8EFD\u91CF\u3001CPU\u306E\u307F): LightOnOCR-2-1B GGUF \u30D5\u30A1\u30A4\u30EB (\u5408\u8A08 ~639 MB) \u3092 data/models/lightonocr/ \u306B\u914D\u7F6E\u3057\u307E\u3059\u3002\n\n\u4ECA\u3059\u3050 docling \u3092\u30A4\u30F3\u30B9\u30C8\u30FC\u30EB\u3057\u307E\u3059\u304B\uFF1F"
  import.frozen_extra_title: "インストール版では利用できません"
  import.frozen_extra_text: "インストール版では Python 環境が実行ファイル内に同梱されており、後から Python パッケージを追加することはできません。\n\n開発環境での相当する手順は次のとおりです:\n    {manual_command}"
  import.ocr_required_frozen_text: "このドキュメントには OCR が必要ですが、利用可能な OCR エンジンがありません。\n\nインストール版では docling 拡張を追加できません。代わりに内蔵の CPU OCR エンジンを使用してください：LightOnOCR-2-1B GGUF ファイル（合計約 639 MB）を次の場所に置いてください\n    {model_dir}\n  ({model_files})\nその後、AGIT を再起動してファイルを再度インポートしてください。"

  privacy.backup.gate.title: "鍵をバックアップする"
  privacy.backup.gate.instruction: "暗号鍵は、このコンピューターの AGIT の鍵フォルダーにしか存在しません — 他のどこにもバックアップされていません。続ける前に、次のフォルダーを安全なオフライン媒体（USB メモリーやその他の取り外し可能な媒体 — ドキュメントを同期しているものと同じクラウドには決して保存しないでください）へコピーしてください。"
  privacy.backup.gate.instruction_how: "暗号化が設定されて動作しているうちに、フォルダー全体 — 中身のすべてのファイル — をコピーしてください。オフラインの場所でコピー先が開けることを確認してから、頼りにしてください。"
  privacy.backup.gate.instruction_ok: "OK — 鍵をバックアップします"
  privacy.backup.gate.verify_title: "バックアップを検証"
  privacy.backup.gate.verify_question: "正しいファイルが安全な場所にコピーされたことを確認しましたか？"

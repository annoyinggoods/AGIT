  import.ocr_required_text: "\u098F\u0987 \u09A8\u09A5\u09BF\u09B0 \u099C\u09A8\u09CD\u09AF OCR \u09AA\u09CD\u09B0\u09AF\u09BC\u09CB\u099C\u09A8, \u0995\u09BF\u09A8\u09CD\u09A4\u09C1 \u0995\u09CB\u09A8\u09CB OCR \u0987\u099E\u09CD\u099C\u09BF\u09A8 \u0989\u09AA\u09B2\u09AC\u09CD\u09A7 \u09A8\u09C7\u0987\u0964\n\u0985\u09AA\u09B6\u09A8 \u09E7 (\u09AD\u09BE\u09B0\u09C0): docling \u0987\u09A8\u09B8\u09CD\u099F\u09B2 \u0995\u09B0\u09C1\u09A8 (~650M \u09AA\u09CD\u09AF\u09BE\u09B0\u09BE\u09AE\u09BF\u099F\u09BE\u09B0):\n    pip install docling\n\u0985\u09AA\u09B6\u09A8 \u09E8 (\u09B9\u09BE\u09B2\u0995\u09BE, \u0995\u09C7\u09AC\u09B2 CPU): LightOnOCR-2-1B GGUF \u09AB\u09BE\u0987\u09B2\u0997\u09C1\u09B2\u09CB (~639 MB \u09AE\u09CB\u099F) data/models/lightonocr/ \u09AB\u09CB\u09B2\u09CD\u09A1\u09BE\u09B0\u09C7 \u09B0\u09BE\u0996\u09C1\u09A8\u0964\ndocling \u098F\u0996\u09A8 \u0987\u09A8\u09B8\u09CD\u099F\u09B2 \u0995\u09B0\u09AC\u09C7\u09A8?"
  import.frozen_extra_title: "ইনস্টল করা সংস্করণে উপলব্ধ নয়"
  import.frozen_extra_text: "ইনস্টল করা বিল্ডগুলোতে Python পরিবেশ এক্সিকিউটেবলের ভেতরে থাকে এবং পরে Python প্যাকেজ যোগ করা যায় না।\n\nডেভেলপমেন্ট ইনস্টলেশনে সমতুল্য ধাপটি হবে:\n    {manual_command}"
  import.ocr_required_frozen_text: "এই নথিটির OCR প্রয়োজন, কিন্তু কোনো OCR ইঞ্জিন উপলব্ধ নেই।\n\nইনস্টল করা বিল্ডগুলোতে docling অতিরিক্ত যোগ করা যায় না। বরং অন্তর্নির্মিত CPU OCR ইঞ্জিন ব্যবহার করুন: LightOnOCR-2-1B GGUF ফাইলগুলো (মোট প্রায় 639 MB) এখানে রাখুন\n    {model_dir}\n  ({model_files})\nতারপর AGIT পুনরায় চালু করে ফাইলটি আবার ইমপোর্ট করুন।"

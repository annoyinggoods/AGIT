  settings.privacy.threat_model: "এটি যা রক্ষা করে: চিহ্নিত ব্যক্তিগত প্রকল্প ও চ্যাট সাইফারটেক্সট হিসেবে সংরক্ষিত (ও সিঙ্ক) হয় — আপনার মেঘ প্রদানকারী, আপনার ডিস্কে প্রবেশাধিকারযোগ্য যে কেউ, এবং লক করা অবস্থায় এই অ্যাপ কেউ পড়তে পারেন না। এটি যা রক্ষা করে না: ক্ষতিগ্রস্ত কম্পিউটারের ম্যালওয়্যার বা কিলোগার, চলমান ও আনলক করা সেশন, অথবা পুনরুদ্ধার কোড ছাড়া ভুলে যাওয়া ফাসফ্রেজ। কোনো ব্যাকডোর নেই — এটাই এর উদ্দেশ্য।"
  settings.privacy.rag_note: "ব্যক্তিগত প্রকল্প AI প্রসঙ্গে (RAG) অনুসন্ধানযোগ্য: তাদের সূচক-এন্ট্রি আপনার গোপনীয়তার কীর অধীনে এনক্রিপ্ট করা থাকে এবং সেশন আনলক থাকলেই কেবল পড়া যায়। লক করা থাকলে এরা কিছুই যোগ করে না।"

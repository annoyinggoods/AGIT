  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama \u09AE\u09CD\u09AF\u09BE\u09A8\u09C1\u09AF\u09BC\u09BE\u09B2 \u0995\u09A8\u09AB\u09BF\u0997\u09BE\u09B0\u09C7\u09B6\u09A8                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  \u0987\u09A8\u09B8\u09CD\u099F\u09B2 \u0995\u09B0\u09BE \u09AE\u09A1\u09C7\u09B2\u09C7\u09B0 \u09A4\u09BE\u09B2\u09BF\u0995\u09BE:     ollama list                         \u2551\n\u2551  \u09B8\u09BE\u09B0\u09CD\u09AD\u09BE\u09B0 \u099A\u09BE\u09B2\u09C1 \u0995\u09B0\u09C1\u09A8:             ollama serve                        \u2551\n\u2551  \u09AE\u09A1\u09C7\u09B2 \u09A1\u09BE\u0989\u09A8\u09B2\u09CB\u09A1 \u0995\u09B0\u09C1\u09A8:           ollama pull <name>                  \u2551\n\u2551  \u09AE\u09A1\u09C7\u09B2 \u09AE\u09C1\u099B\u09C1\u09A8:                 ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM \u099F\u09BF\u0989\u09A8\u09BF\u0982 (ollama serve \u099A\u09BE\u09B2\u09BE\u09A8\u09CB\u09B0 \u0986\u0997\u09C7 \u09B8\u09C7\u099F \u0995\u09B0\u09C1\u09A8):             \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (\u09B8\u09B0\u09CD\u09AC\u09CB\u099A\u09CD\u099A VRAM \u09AC\u09CD\u09AF\u09AC\u09B9\u09BE\u09B0)         \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (\u09A1\u09BF\u09B8\u09AA\u09CD\u09B2\u09C7\u09B0 \u099C\u09A8\u09CD\u09AF \u09B8\u0982\u09B0\u0995\u09CD\u09B7\u09BF\u09A4)       \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (\u09AB\u09CD\u09B2\u09CD\u09AF\u09BE\u09B6 \u0985\u09CD\u09AF\u09BE\u099F\u09C7\u09A8\u09B6\u09A8 \u09B8\u0995\u09CD\u09B0\u09BF\u09AF\u09BC)    \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (\u098F\u0995\u0987 \u09B8\u09BE\u09A5\u09C7 \u0985\u09A8\u09C1\u09B0\u09CB\u09A7 \u09B8\u0982\u0996\u09CD\u09AF\u09BE)      \u2551\n\u2551                                                                \u2551\n\u2551  \u09A8\u09A5\u09BF\u09AA\u09A4\u09CD\u09B0: https://ollama.com/docs                                \u2551\n\u2551                                                                \u2551\n\u2551  \u0997\u09C1\u09B0\u09C1\u09A4\u09CD\u09AC\u09AA\u09C2\u09B0\u09CD\u09A3: Ollama \u09A1\u09C7\u0995\u09CD\u09B8\u099F\u09AA \u0985\u09CD\u09AF\u09BE\u09AA \u099A\u09B2\u09B2\u09C7, \u098F\u099F\u09BF \u0987\u09A4\u09BF\u09AE\u09A7\u09CD\u09AF\u09C7\u0987 \u09AA\u09CB\u09B0\u09CD\u099F \u09E7\u09E7\u09EA\u09E9\u09EA \u2551\n\u2551  \u09A6\u0996\u09B2 \u0995\u09B0\u09C7 \u09B0\u09BE\u0996\u09C7\u0964 \u0995\u09BE\u09B8\u09CD\u099F\u09AE \u09AB\u09CD\u09B2\u09CD\u09AF\u09BE\u0997 \u09B8\u09B9 \"ollama serve\" \u099A\u09BE\u09B2\u09BE\u09A8\u09CB\u09B0 \u0986\u0997\u09C7   \u2551\n\u2551  \u098F\u099F\u09BF \u09AC\u09A8\u09CD\u09A7 \u0995\u09B0\u09C1\u09A8\u0964                                                \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama \u09AE\u09CD\u09AF\u09BE\u09A8\u09C1\u09AF\u09BC\u09BE\u09B2 \u0995\u09A8\u09AB\u09BF\u0997\u09BE\u09B0\u09C7\u09B6\u09A8                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  \u0987\u09A8\u09B8\u09CD\u099F\u09B2 \u0995\u09B0\u09BE \u09AE\u09A1\u09C7\u09B2\u09C7\u09B0 \u09A4\u09BE\u09B2\u09BF\u0995\u09BE:     ollama list                         \u2551\n\u2551  \u09B8\u09BE\u09B0\u09CD\u09AD\u09BE\u09B0 \u099A\u09BE\u09B2\u09C1 \u0995\u09B0\u09C1\u09A8:             ollama serve                        \u2551\n\u2551  \u09AE\u09A1\u09C7\u09B2 \u09A1\u09BE\u0989\u09A8\u09B2\u09CB\u09A1 \u0995\u09B0\u09C1\u09A8:           ollama pull <name>                  \u2551\n\u2551  \u09AE\u09A1\u09C7\u09B2 \u09AE\u09C1\u099B\u09C1\u09A8:                 ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM \u099F\u09BF\u0989\u09A8\u09BF\u0982 (ollama serve \u099A\u09BE\u09B2\u09BE\u09A8\u09CB\u09B0 \u0986\u0997\u09C7 \u09B8\u09C7\u099F \u0995\u09B0\u09C1\u09A8):             \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # \u09B8\u09B0\u09CD\u09AC\u09CB\u099A\u09CD\u099A VRAM \u09AC\u09CD\u09AF\u09AC\u09B9\u09BE\u09B0     \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # \u09A1\u09BF\u09B8\u09AA\u09CD\u09B2\u09C7\u09B0 \u099C\u09A8\u09CD\u09AF \u09B8\u0982\u09B0\u0995\u09CD\u09B7\u09BF\u09A4   \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # \u09AB\u09CD\u09B2\u09CD\u09AF\u09BE\u09B6 \u0985\u09CD\u09AF\u09BE\u099F\u09C7\u09A8\u09B6\u09A8 \u09B8\u0995\u09CD\u09B0\u09BF\u09AF\u09BC \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # \u098F\u0995\u0987 \u09B8\u09BE\u09A5\u09C7 \u0985\u09A8\u09C1\u09B0\u09CB\u09A7 \u09B8\u0982\u0996\u09CD\u09AF\u09BE   \u2551\n\u2551                                                                \u2551\n\u2551  \u09A8\u09A5\u09BF\u09AA\u09A4\u09CD\u09B0: https://ollama.com/docs                                \u2551\n\u2551                                                                \u2551\n\u2551  \u0997\u09C1\u09B0\u09C1\u09A4\u09CD\u09AC\u09AA\u09C2\u09B0\u09CD\u09A3: Ollama \u09A1\u09C7\u0995\u09CD\u09B8\u099F\u09AA \u0985\u09CD\u09AF\u09BE\u09AA \u099A\u09B2\u09B2\u09C7, \u098F\u099F\u09BF \u0987\u09A4\u09BF\u09AE\u09A7\u09CD\u09AF\u09C7\u0987 \u09AA\u09CB\u09B0\u09CD\u099F \u09E7\u09E7\u09EA\u09E9\u09EA \u2551\n\u2551  \u09A6\u0996\u09B2 \u0995\u09B0\u09C7 \u09B0\u09BE\u0996\u09C7\u0964 \u0995\u09BE\u09B8\u09CD\u099F\u09AE \u09AB\u09CD\u09B2\u09CD\u09AF\u09BE\u0997 \u09B8\u09B9 \"ollama serve\" \u099A\u09BE\u09B2\u09BE\u09A8\u09CB\u09B0 \u0986\u0997\u09C7   \u2551\n\u2551  \u098F\u099F\u09BF \u09AC\u09A8\u09CD\u09A7 \u0995\u09B0\u09C1\u09A8\u0964                                                \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u
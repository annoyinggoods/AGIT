  privacy.backup.gate.title: "আপনার কী সংরক্ষণ করুন"
  privacy.backup.gate.instruction: "আপনার এনক্রিপশন কী শুধু এই কম্পিউটারের AGIT কী-ফোল্ডারেই থাকে — অন্য কোথাও সংরক্ষিত নয়। এগিয়ে যাওয়ার আগে নিচের ফোল্ডারটি নিরাপদ অফলাইন মাধ্যমে কপি করুন (একটি ইউএসবি ড্রাইভ বা অন্য সরানো যায় এমন মাধ্যম — যে মেঘে আপনি নথি সিঙ্ক করেন সেটা কখনো নয়)।"
  privacy.backup.gate.instruction_how: "পুরো ফোল্ডারটি কপি করুন — ভিতরের প্রতিটি ফাইল — যখন এনক্রিপশন ঠিক করা ও কাজ করছে। অফলাইন অবস্থান থেকে কপিটি খোলা যায় কি না তা যাচাই না করে তা বিশ্বাস করবেন না।"
  privacy.backup.gate.instruction_ok: "ঠিক আছে — আমি কী ব্যাকআপ নেব"

  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551                    Ollama \uC218\uB3D9 \uAD6C\uC131                              \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                  \u2551\n\u2551  \uC124\uCE58\uB41C \uBAA8\uB378 \uBAA9\uB85D:      ollama list                              \u2551\n\u2551  \uC11C\uBC84 \uC2E4\uD589:             ollama serve                             \u2551\n\u2551  \uBAA8\uB378 \uB2E4\uC6B4\uB85C\uB4DC:         ollama pull <name>                       \u2551\n\u2551  \uBAA8\uB378 \uC0AD\uC81C:             ollama rm <name>                         \u2551\n\u2551                                                                  \u2551\n\u2551  GPU / VRAM \uD29C\uB2DD (ollama serve \uC2E4\uD589 \uC804\uC5D0 \uC124\uC815):                  \u2551\n\u2551                                                                  \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB         (\uC0AC\uC6A9\uD560 \uCD5C\uB300 VRAM)            \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB   (\uB514\uC2A4\uD50C\uB808\uC774 \uC608\uC57D)             \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1    (\uD50C\uB798\uC2DC \uC5B4\uD150\uC158 \uD65C\uC131\uD654)        \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1       (\uB3D9\uC2DC \uC694\uCCAD \uC218)                \u2551\n\u2551                                                                  \u2551\n\u2551  \uBB38\uC11C: https://ollama.com/docs                                   \u2551\n\u2551                                                                  \u2551\n\u2551  \uC911\uC694: Ollama \uB370\uC2A4\uD06C\uD1B1 \uC571\uC774 \uC2E4\uD589 \uC911\uC774\uBA74 \uC774\uBBF8 \uD3EC\uD2B8 11434\uB97C         \u2551\n\u2551  \uC810\uC720\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uC0AC\uC6A9\uC790 \uC9C0\uC815 \uD50C\uB798\uADF8\uB85C \"ollama serve\"\uB97C        \u2551\n\u2551  \uC2E4\uD589\uD558\uAE30 \uC804\uC5D0 \uD574\uB2F9 \uC571\uC744 \uBA3C\uC800 \uC885\uB8CC\uD558\uC138\uC694.                        \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

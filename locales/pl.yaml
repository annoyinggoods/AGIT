  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               R\u0119czna konfiguracja Ollama                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Lista zainstalowanych modeli:     ollama list                  \u2551\n\u2551  Uruchom serwer:            ollama serve                        \u2551\n\u2551  Pobierz model:              ollama pull <name>                 \u2551\n\u2551  Usu\u0144 model:            ollama rm <name>                        \u2551\n\u2551                                                                \u2551\n\u2551  Strojenie GPU / VRAM (ustaw przed ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (maks. u\u017Cywane VRAM)        \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (rezerwa na wy\u015Bwietlanie)   \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (w\u0142\u0105cza flash attention)    \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (r\xF3wnoleg\u0142e \u017C\u0105dania)        \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentacja: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  WA\u017BNE: Je\u015Bli dzia\u0142a aplikacja Ollama Desktop, port 11434 jest  \u2551\n\u2551  ju\u017C zaj\u0119ty. Zatrzymaj j\u0105 przed uruchomieniem \"ollama serve\" z  \u2551\n\u2551  w\u0142asnymi flagami.                                              \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               R\u0119czna konfiguracja Ollama                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Lista zainstalowanych modeli:     ollama list                  \u2551\n\u2551  Uruchom serwer:            ollama serve                        \u2551\n\u2551  Pobierz model:              ollama pull <name>                 \u2551\n\u2551  Usu\u0144 model:            ollama rm <name>                        \u2551\n\u2551                                                                \u2551\n\u2551  Strojenie GPU / VRAM (ustaw przed ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # maks. u\u017Cywane VRAM     \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # rezerwa na wy\u015Bwietlanie\u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # w\u0142\u0105cza flash attention \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # r\xF3wnoleg\u0142e \u017C\u0105dania     \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentacja: https://ollama.com/docs                          \u2551\n\u2551                                                                \u2551\n\u2551  WA\u017BNE: Je\u015Bli dzia\u0142a aplikacja Ollama Desktop, port 11434 jest  \u2551\n\u2551  ju\u017C zaj\u0119ty. Zatrzymaj j\u0105 przed uruchomieniem \"ollama serve\" z  \u2551\n\u2551  w\u0142asnymi flagami.                                              \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

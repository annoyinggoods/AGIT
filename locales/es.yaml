  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Configuraci\xF3n manual de Ollama                       \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Listar modelos instalados:     ollama list                         \u2551\n\u2551  Ejecutar servidor:            ollama serve                        \u2551\n\u2551  Extraer modelo:              ollama pull <nombre>                  \u2551\n\u2551  Eliminar modelo:            ollama rm <nombre>                    \u2551\n\u2551                                                                \u2551\n\u2551  Ajustes de GPU / VRAM (establecer antes de ollama serve):                   \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (VRAM m\xE1xima a usar)           \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (reservar para pantalla)       \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (activar flash attention)    \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (peticiones concurrentes)       \u2551\n\u2551                                                                \u2551\n\u2551  Docs: https://ollama.com/docs                                  \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANTE: Si la aplicaci\xF3n de escritorio Ollama est\xE1 en ejecuci\xF3n, ya        \u2551\n\u2551  ocupa el puerto 11434. Det\xE9n-la antes de ejecutar \xABollama serve\xBB     \u2551\n\u2551  con indicadores personalizados.                                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Configuraci\xF3n manual de Ollama                       \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Listar modelos instalados:     ollama list                         \u2551\n\u2551  Ejecutar servidor:            ollama serve                        \u2551\n\u2551  Extraer modelo:              ollama pull <nombre>                  \u2551\n\u2551  Eliminar modelo:            ollama rm <nombre>                    \u2551\n\u2551                                                                \u2551\n\u2551  Ajustes de GPU / VRAM (establecer antes de ollama serve):                   \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\\\"8GB\\\"        # VRAM m\xE1xima a usar        \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\\\"512MB\\\"  # reservar para pantalla    \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\\\"1\\\"   # activar flash attention \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\\\"1\\\"      # peticiones concurrentes    \u2551\n\u2551                                                                \u2551\n\u2551  Docs: https://ollama.com/docs                                  \u2551\n\u2551                                                                \u2551\n\u2551  IMPORTANTE: Si la aplicaci\xF3n de escritorio Ollama est\xE1 en ejecuci\xF3n, ya        \u2551\n\u2551  ocupa el puerto 11434. Det\xE9n-la antes de ejecutar \xABollama serve\xBB     \u2551\n\u2551  con indicadores personalizados.                                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

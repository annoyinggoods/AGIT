  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama Manuel Yap\u0131land\u0131rma                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Kurulu modelleri listele:    ollama list                       \u2551\n\u2551  Sunucuyu \xE7al\u0131\u015Ft\u0131r:           ollama serve                      \u2551\n\u2551  Model \xE7ek:                   ollama pull <name>                 \u2551\n\u2551  Model sil:                   ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM ayarlama (ollama serve'den \xF6nce ayarlay\u0131n):        \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (maksimum kullan\u0131lacak VRAM) \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (g\xF6r\xFCnt\xFC i\xE7in ayr\u0131lan)      \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (flash attention etkinle\u015Ftir)\u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (e\u015F istekler)               \u2551\n\u2551                                                                \u2551\n\u2551  Dok\xFCmanlar: https://ollama.com/docs                            \u2551\n\u2551                                                                \u2551\n\u2551  \xD6NEML\u0130: Ollama masa\xFCst\xFC uygulamas\u0131 \xE7al\u0131\u015F\u0131yorsa, zaten         \u2551\n\u2551  11434 portunu i\u015Fgal ediyor. \xD6zel bayraklarla \"ollama serve\"   \u2551\n\u2551  \xE7al\u0131\u015Ft\u0131rmadan \xF6nce onu durdurun.                               \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Ollama Manuel Yap\u0131land\u0131rma                        \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Kurulu modelleri listele:    ollama list                       \u2551\n\u2551  Sunucuyu \xE7al\u0131\u015Ft\u0131r:           ollama serve                      \u2551\n\u2551  Model \xE7ek:                   ollama pull <name>                 \u2551\n\u2551  Model sil:                   ollama rm <name>                    \u2551\n\u2551                                                                \u2551\n\u2551  GPU / VRAM ayarlama (ollama serve'den \xF6nce ayarlay\u0131n):        \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # maksimum kullan\u0131lacak VRAM \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # g\xF6r\xFCnt\xFC i\xE7in ayr\u0131lan    \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # flash attention etkinle\u015Ftir \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # e\u015F istekler            \u2551\n\u2551                                                                \u2551\n\u2551  Dok\xFCmanlar: https://ollama.com/docs                            \u2551\n\u2551                                                                \u2551\n\u2551  \xD6NEML\u0130: Ollama masa\xFCst\xFC uygulamas\u0131 \xE7al\u0131\u015F\u0131yorsa, zaten         \u2551\n\u2551  11434 portunu i\u015Fgal ediyor. \xD6zel bayraklarla \"ollama serve\"   \u2551\n\u2551  \xE7al\u0131\u015Ft\u0131rmadan \xF6nce onu durdurun.                               \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"

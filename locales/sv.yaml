  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Manuell konfiguration av Ollama                   \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Visa installerade modeller:     ollama list                    \u2551\n\u2551  Starta servern:            ollama serve                        \u2551\n\u2551  H\xE4mta en modell:              ollama pull <name>               \u2551\n\u2551  Ta bort en modell:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  GPU-/VRAM-inst\xE4llningar (st\xE4ll in innan ollama serve):         \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (max VRAM att anv\xE4nda)      \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (reserv f\xF6r visning)        \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (sl\xE5r p\xE5 flash attention)   \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (samtidiga anrop)           \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentation: https://ollama.com/docs                         \u2551\n\u2551                                                                \u2551\n\u2551  VIKTIGT: K\xF6rs Ollama skrivbordsapp redan \xE4r port 11434         \u2551\n\u2551  upptagen. St\xE4ng den innan du k\xF6r \"ollama serve\" med egna       \u2551\n\u2551  flaggor.                                                       \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Manuell konfiguration av Ollama                   \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Visa installerade modeller:     ollama list                    \u2551\n\u2551  Starta servern:            ollama serve                        \u2551\n\u2551  H\xE4mta en modell:              ollama pull <name>               \u2551\n\u2551  Ta bort en modell:            ollama rm <name>                 \u2551\n\u2551                                                                \u2551\n\u2551  GPU-/VRAM-inst\xE4llningar (st\xE4ll in innan ollama serve):         \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # max VRAM att anv\xE4nda   \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # reserv f\xF6r visning     \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # sl\xE5r p\xE5 flash attention\u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # samtidiga anrop        \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentation: https://ollama.com/docs                         \u2551\n\u2551                                                                \u2551\n\u2551  VIKTIGT: K\xF6rs Ollama skrivbordsapp redan \xE4r port 11434         \u2551\n\u2551  upptagen. St\xE4ng den innan du k\xF6r \"ollama serve\" med egna       \u2551\n\u2551  flaggor.                                                       \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

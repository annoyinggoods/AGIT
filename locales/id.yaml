  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Konfigurasi Manual Ollama                         \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Daftar model terpasang:     ollama list                        \u2551\n\u2551  Jalankan server:            ollama serve                       \u2551\n\u2551  Unduh model:              ollama pull <name>                   \u2551\n\u2551  Hapus model:            ollama rm <name>                       \u2551\n\u2551                                                                \u2551\n\u2551  Penyetelan GPU / VRAM (atur sebelum ollama serve):             \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (VRAM maksimum yang dipakai)\u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (cadangan untuk tampilan)   \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (aktifkan flash attention)  \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (permintaan bersamaan)      \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentasi: https://ollama.com/docs                           \u2551\n\u2551                                                                \u2551\n\u2551  PENTING: Jika aplikasi desktop Ollama sedang berjalan, port    \u2551\n\u2551  11434 sudah terpakai. Hentikan dulu sebelum menjalankan        \u2551\n\u2551  \"ollama serve\" dengan flag kustom.                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Konfigurasi Manual Ollama                         \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Daftar model terpasang:     ollama list                        \u2551\n\u2551  Jalankan server:            ollama serve                       \u2551\n\u2551  Unduh model:              ollama pull <name>                   \u2551\n\u2551  Hapus model:            ollama rm <name>                       \u2551\n\u2551                                                                \u2551\n\u2551  Penyetelan GPU / VRAM (atur sebelum ollama serve):             \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"     # VRAM maksimum yang dipakai\u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # cadangan untuk tampilan\u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"  # aktifkan flash attention\u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # permintaan bersamaan   \u2551\n\u2551                                                                \u2551\n\u2551  Dokumentasi: https://ollama.com/docs                           \u2551\n\u2551                                                                \u2551\n\u2551  PENTING: Jika aplikasi desktop Ollama sedang berjalan, port    \u2551\n\u2551  11434 sudah terpakai. Hentikan dulu sebelum menjalankan        \u2551\n\u2551  \"ollama serve\" dengan flag kustom.                             \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\n"

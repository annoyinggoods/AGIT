  privacy.backup.gate.title: احفظ مفاتيحك
  privacy.backup.gate.instruction: لا تقيم مفاتيح التشفير إلا في مجلد مفاتيح AGIT على هذا الجهاز — ولا تُنسخ احتياطيًا إلى أي مكان آخر. قبل أن تتابع، انسخ المجلد أدناه إلى وسيط آمن دون اتصال (ذاكرة USB أو وسائط أخرى قابلة للفصل — ولا تضعها أبدًا في السحابة نفسها التي تزامن بها مستنداتك).
  privacy.backup.gate.instruction_how: انسخ المجلد كاملًا — كل ملف فيه — أثناء إعداد التشفير وهو يعمل. وتحقق من أن النسخة تُفتح من الموقع دون اتصال قبل أن تعتمد عليها.
  privacy.backup.gate.instruction_ok: موافق — سأحفظ مفاتيحك احتياطيًا

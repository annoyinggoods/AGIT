  import.ocr_required_frozen_text: "يحتاج هذا المستند إلى OCR، لكن لا يوجد محرك OCR متاح.\n\nالنسخ المثبّتة لا يمكنها إضافة مكوّن docling. استخدم محرك OCR المدمج للمعالج بدلاً من ذلك: ضع ملفات LightOnOCR-2-1B GGUF (حوالي 639 MB إجمالاً) في\n    {model_dir}\n  ({model_files})\nثم أعد تشغيل AGIT واستورد الملف مرة أخرى."

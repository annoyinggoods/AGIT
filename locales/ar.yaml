  sync.conflicts.set_summary: عُثر على فروع مزامنة منزاعة. اختر النزاعات التي تريد حلها الآن — فكل ما تتخطاه يبقى معلّقًا ويُعرض من جديد في المزامنة التالية؛ ولا يُحذف شيء ولا يُدمج في صمت أبدًا.

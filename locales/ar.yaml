  venv.onboarding.title: "\u0625\u0639\u062F\u0627\u062F venv"
  venv.onboarding.body: "The venv allows LLMs to use tools and access Python (skills, code runs, analytics). If you don't intend on using these features you don't need to set it up now. You can set it up later from Settings or Chat settings."

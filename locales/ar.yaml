  ai.error.oom_message: "\u0630\u0627\u0643\u0631\u0629 \u063A\u064A\u0631 \u0643\u0627\u0641\u064A\u0629 \u0644\u0627\u0633\u062A\u0646\u062A\u0627\u062C \u0627\u0644\u0646\u0645\u0648\u0630\u062C. \u062C\u0631\u0651\u0628 \u0646\u0645\u0648\u0630\u062C\u0627\u064B \u0623\u0635\u063A\u0631\u060C \u0623\u063A\u0644\u0642 \u062A\u0637\u0628\u064A\u0642\u0627\u062A GPU \u0627\u0644\u0623\u062E\u0631\u0649\u060C \u0623\u0648 \u062D\u0631\u0651\u0631 \u0630\u0627\u0643\u0631\u0629 \u0627\u0644\u0646\u0638\u0627\u0645 RAM."

  settings.privacy.rag_note: "Ana iya nema ayyukanka na sirri a cikin context na AI (RAG): shigaror da ke cikin index ɗin ana ɓoye su a karkashin maɓallin sirrinka kuma za a iya karanta su kawai yayin da zaman yake buɗe. Idan a kulle, ba za su ba da wani abu ba."

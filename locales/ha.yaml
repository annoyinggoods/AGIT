  settings.ai.ollama_terminal_help: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Tsarin Hannu na Ollama                            \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Jera samfuran da aka shigar:     ollama list                   \u2551\n\u2551  Gudanar da uwar garke:           ollama serve                  \u2551\n\u2551  Zazzage samfur:                  ollama pull             \u2551\n\u2551  Goge samfur:                     ollama rm               \u2551\n\u2551                                                                \u2551\n\u2551  Daidaita GPU / VRAM (saita kafin ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    set OLLAMA_MAX_VRAM=8GB          (matsakaicin VRAM)         \u2551\n\u2551    set OLLAMA_GPU_OVERHEAD=512MB    (kare don nuni)            \u2551\n\u2551    set OLLAMA_FLASH_ATTENTION=1     (kunna flash attention)    \u2551\n\u2551    set OLLAMA_NUM_PARALLEL=1        (bukatu lokaci guda)       \u2551\n\u2551                                                                \u2551\n\u2551  Takardu: https://ollama.com/docs                              \u2551\n\u2551                                                                \u2551\n\u2551  MUHIMMI: Idan aikace-aikacen tesfot na Ollama yana aiki, riga \u2551\n\u2551  ya mamaye mashiga 11434. Dakatar da shi kafin gudanar da       \u2551\n\u2551  \"ollama serve\" tare da ke\u0253a\u0253\u0253un tutoci.                        \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
  settings.ai.ollama_terminal_help_posix: "\n\u2554\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\n\u2551               Tsarin Hannu na Ollama                            \u2551\n\u2560\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2563\n\u2551                                                                \u2551\n\u2551  Jera samfuran da aka shigar:     ollama list                   \u2551\n\u2551  Gudanar da uwar garke:           ollama serve                  \u2551\n\u2551  Zazzage samfur:                  ollama pull             \u2551\n\u2551  Goge samfur:                     ollama rm               \u2551\n\u2551                                                                \u2551\n\u2551  Daidaita GPU / VRAM (saita kafin ollama serve):               \u2551\n\u2551                                                                \u2551\n\u2551    export OLLAMA_MAX_VRAM=\"8GB\"        # matsakaicin VRAM      \u2551\n\u2551    export OLLAMA_GPU_OVERHEAD=\"512MB\"  # kare don nuni          \u2551\n\u2551    export OLLAMA_FLASH_ATTENTION=\"1\"   # kunna flash attention  \u2551\n\u2551    export OLLAMA_NUM_PARALLEL=\"1\"      # bukatu lokaci guda     \u2551\n\u2551                                                                \u2551\n\u2551  Takardu: https://ollama.com/docs                              \u2551\n\u2551                                                                \u2551\n\u2551  MUHIMMI: Idan aikace-aikacen tesfot na Ollama yana aiki, riga \u2551\n\u2551  ya mamaye mashiga 11434. Dakatar da shi kafin gudanar da       \u2551\n\u2551  \"ollama serve\" tare da ke\u0253a\u0253\u0253un tutoci.                        \u2551\n\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D"
